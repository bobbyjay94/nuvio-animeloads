
name: Build AnimeLoads Provider

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: AnimeLoads Provider bauen
        run: npm run build:provider -- animeloads

      - name: Fertige Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: animeloads-provider
          path: providers/animeloads.js
          if-no-files-found: error
